name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "doc/**"
      - "wiki/**"
      - "scripts/build-docs.py"
      - "scripts/generate-update-manifest.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "doc/**"
      - "wiki/**"
      - "scripts/build-docs.py"
      - "scripts/generate-update-manifest.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  release:
    types: [published, edited, deleted]
  # Releases created by GITHUB_TOKEN do not trigger release workflows.
  workflow_run:
    workflows: ["Multiplatform Release Build"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    name: Build website and bilingual wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}

      - name: Install pinned mdBook
        env:
          MDBOOK_VERSION: "0.4.52"
          MDBOOK_SHA256: "c0b903f01dd8f4edc644372ad2b80b1fdddd12552d37b6a098657cbd8eddd768"
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$RUNNER_TEMP/mdbook.tar.gz"
          echo "${MDBOOK_SHA256}  $RUNNER_TEMP/mdbook.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/mdbook-bin"
          tar -xzf "$RUNNER_TEMP/mdbook.tar.gz" -C "$RUNNER_TEMP/mdbook-bin" mdbook
          echo "$RUNNER_TEMP/mdbook-bin" >> "$GITHUB_PATH"

      - name: Validate and build documentation
        run: python3 scripts/build-docs.py

      - name: Generate stable release update manifest
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/latest-release.json"
          python3 scripts/generate-update-manifest.py "$RUNNER_TEMP/latest-release.json" _site/latest.json

      - name: Upload website artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publish website and wiki
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
