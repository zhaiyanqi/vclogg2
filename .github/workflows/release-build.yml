name: Multiplatform Release Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  VCLOGG2_BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      WINDOWS_SIGNING_PROVIDER: ${{ vars.WINDOWS_SIGNING_PROVIDER || 'unsigned' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize Rust toolchain
        shell: powershell
        run: |
          rustc --version
          cargo --version

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Validate Windows signing provider
        shell: powershell
        run: |
          if ($env:WINDOWS_SIGNING_PROVIDER -notin @('unsigned', 'pfx', 'artifact-signing')) {
            throw 'WINDOWS_SIGNING_PROVIDER must be unsigned, pfx, or artifact-signing.'
          }

      - name: Build unsigned Windows release package
        if: env.WINDOWS_SIGNING_PROVIDER == 'unsigned'
        shell: powershell
        run: >-
          powershell -ExecutionPolicy Bypass -File scripts/package-release.ps1
          -SigningMode None

      - name: Build Windows release executable
        if: env.WINDOWS_SIGNING_PROVIDER == 'artifact-signing'
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/build-release.ps1

      - name: Sign in to Azure with OIDC
        if: env.WINDOWS_SIGNING_PROVIDER == 'artifact-signing'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows executable with Artifact Signing
        if: env.WINDOWS_SIGNING_PROVIDER == 'artifact-signing'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.WINDOWS_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.WINDOWS_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.WINDOWS_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files: ${{ github.workspace }}\target\release\vclogg2.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: VCLogg2
          description-url: https://github.com/zhaiyanqi/vclogg2

      - name: Package Artifact Signed Windows release
        if: env.WINDOWS_SIGNING_PROVIDER == 'artifact-signing'
        shell: powershell
        run: >-
          powershell -ExecutionPolicy Bypass -File scripts/package-release.ps1
          -SigningMode PreSigned -SkipBuild

      - name: Restore Windows signing certificate
        if: env.WINDOWS_SIGNING_PROVIDER == 'pfx'
        shell: powershell
        env:
          VCLOGG2_WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
        run: |
          $encodedCertificate = $env:VCLOGG2_WINDOWS_SIGNING_CERTIFICATE_BASE64
          if ([string]::IsNullOrWhiteSpace($encodedCertificate)) {
            throw 'The WINDOWS_SIGNING_CERTIFICATE_BASE64 secret is required.'
          }
          try {
            $certificateBytes = [Convert]::FromBase64String($encodedCertificate)
          } catch {
            throw 'WINDOWS_SIGNING_CERTIFICATE_BASE64 is not valid Base64.'
          }
          if ($certificateBytes.Length -eq 0) {
            throw 'WINDOWS_SIGNING_CERTIFICATE_BASE64 decoded to an empty file.'
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'vclogg2-signing.pfx'
          [System.IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
          $encodedCertificate = $null
          $certificateBytes = $null

      - name: Build and sign Windows release package with PFX
        if: env.WINDOWS_SIGNING_PROVIDER == 'pfx'
        shell: powershell
        env:
          VCLOGG2_WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          VCLOGG2_WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
        run: >-
          powershell -ExecutionPolicy Bypass -File scripts/package-release.ps1
          -SigningMode Pfx
          -SigningCertificatePath "$env:RUNNER_TEMP\vclogg2-signing.pfx"

      - name: Remove Windows signing certificate
        if: always() && env.WINDOWS_SIGNING_PROVIDER == 'pfx'
        shell: powershell
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'vclogg2-signing.pfx'
          if (Test-Path -LiteralPath $certificatePath -PathType Leaf) {
            Remove-Item -LiteralPath $certificatePath -Force
          }

      - name: Verify signature in packaged Windows release
        if: env.WINDOWS_SIGNING_PROVIDER != 'unsigned'
        shell: powershell
        run: |
          $archives = @(Get-ChildItem -LiteralPath 'dist\windows-x86_64' -Filter 'vclogg2-*-windows-x86_64.zip')
          if ($archives.Count -ne 1) {
            throw "Expected exactly one Windows release archive, found $($archives.Count)."
          }
          $verificationDirectory = Join-Path $env:RUNNER_TEMP 'vclogg2-signature-verification'
          if (Test-Path -LiteralPath $verificationDirectory) {
            Remove-Item -LiteralPath $verificationDirectory -Recurse -Force
          }
          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath $verificationDirectory
          $executables = @(Get-ChildItem -LiteralPath $verificationDirectory -Filter 'vclogg2.exe' -Recurse)
          if ($executables.Count -ne 1) {
            throw "Expected exactly one packaged vclogg2.exe, found $($executables.Count)."
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $executables[0].FullName
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid -or
              $null -eq $signature.SignerCertificate -or
              $null -eq $signature.TimeStamperCertificate) {
            throw "Packaged vclogg2.exe must have a valid trusted Authenticode signature and RFC 3161 timestamp; status: $($signature.Status)."
          }
          Write-Output "Verified signer: $($signature.SignerCertificate.Subject)"
          Write-Output "Verified timestamp authority: $($signature.TimeStamperCertificate.Subject)"

      - name: Upload Windows release package
        uses: actions/upload-artifact@v7
        with:
          name: vclogg2-windows-x86_64
          path: dist/windows-x86_64/vclogg2-*-windows-x86_64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  macos:
    name: macOS AArch64
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Build macOS release package
        run: ./scripts/package-release-macos.sh

      - name: Upload macOS release package
        uses: actions/upload-artifact@v7
        with:
          name: vclogg2-macos-aarch64
          path: dist/macos-aarch64/vclogg2-*-macos-aarch64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install GPUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            clang \
            cmake \
            libfontconfig-dev \
            libglib2.0-dev \
            libssl-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxkbcommon-x11-dev \
            pkg-config

      - name: Initialize Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Build Linux release package
        run: ./scripts/package-release-linux.sh

      - name: Upload Linux release package
        uses: actions/upload-artifact@v7
        with:
          name: vclogg2-linux-x86_64
          path: dist/linux-x86_64/vclogg2-*-linux-x86_64.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [windows, macos, linux]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout release history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Windows release package
        uses: actions/download-artifact@v8
        with:
          name: vclogg2-windows-x86_64
          path: release-assets/windows-x86_64

      - name: Download macOS release package
        uses: actions/download-artifact@v8
        with:
          name: vclogg2-macos-aarch64
          path: release-assets/macos-aarch64

      - name: Download Linux release package
        uses: actions/download-artifact@v8
        with:
          name: vclogg2-linux-x86_64
          path: release-assets/linux-x86_64

      - name: Validate GitHub Release packages
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          windows_packages=(release-assets/windows-x86_64/vclogg2-*-windows-x86_64.zip)
          if (( ${#windows_packages[@]} != 1 )) || [[ ! -s "${windows_packages[0]}" ]]; then
            echo "Expected exactly one non-empty Windows release package." >&2
            exit 1
          fi
          packages=(
            "${windows_packages[0]}"
            "release-assets/macos-aarch64/vclogg2-${version}-macos-aarch64.zip"
            "release-assets/linux-x86_64/vclogg2-${version}-linux-x86_64.tar.gz"
          )
          for package in "${packages[@]}"; do
            test -s "$package"
          done

      - name: Generate release notes from commits
        shell: bash
        run: |
          previous_tag="$(
            git describe --tags --match 'v*' --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true
          )"

          if [[ -n "$previous_tag" ]]; then
            commit_range="$previous_tag..$GITHUB_REF_NAME"
            notes_heading="Changes since $previous_tag"
          else
            commit_range="$GITHUB_REF_NAME"
            notes_heading="Changes in $GITHUB_REF_NAME"
          fi

          {
            echo "## $notes_heading"
            echo
            git log "$commit_range" \
              --pretty=format:'- %s ([%h](https://github.com/'"$GITHUB_REPOSITORY"'/commit/%H))'
            echo

            if [[ -n "$previous_tag" ]]; then
              echo
              echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$previous_tag...$GITHUB_REF_NAME"
            fi
          } > release-notes.md

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_options=(
            --verify-tag
            --notes-file release-notes.md
            --title "VCLogg2 $GITHUB_REF_NAME"
            --latest
          )
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_options=(
              --verify-tag
              --notes-file release-notes.md
              --title "VCLogg2 $GITHUB_REF_NAME"
              --prerelease
              --latest=false
            )
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            release-assets/windows-x86_64/vclogg2-*-windows-x86_64.zip \
            release-assets/macos-aarch64/vclogg2-*-macos-aarch64.zip \
            release-assets/linux-x86_64/vclogg2-*-linux-x86_64.tar.gz \
            "${release_options[@]}"
