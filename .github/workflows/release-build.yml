name: Multiplatform Release Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  VCLOGG2_BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize Rust toolchain
        shell: powershell
        run: |
          rustc --version
          cargo --version

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Build Windows release package
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/package-release.ps1

      - name: Upload Windows release package
        uses: actions/upload-artifact@v7
        with:
          name: vclogg2-windows-x86_64
          path: |
            dist/windows-x86_64/vclogg2-*-windows-x86_64.zip
            dist/windows-x86_64/vclogg2-*-windows-x86_64.blockmap.json
            dist/windows-x86_64/latest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  macos:
    name: macOS AArch64
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Build macOS release package
        run: ./scripts/package-release-macos.sh

      - name: Upload macOS release package
        uses: actions/upload-artifact@v7
        with:
          name: vclogg2-macos-aarch64
          path: |
            dist/macos-aarch64/vclogg2-*-macos-aarch64.zip
            dist/macos-aarch64/vclogg2-*-macos-aarch64.blockmap.json
            dist/macos-aarch64/latest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install GPUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            clang \
            cmake \
            libfontconfig-dev \
            libglib2.0-dev \
            libssl-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxkbcommon-x11-dev \
            pkg-config

      - name: Initialize Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Build Linux release package
        run: ./scripts/package-release-linux.sh

      - name: Upload Linux release package
        uses: actions/upload-artifact@v7
        with:
          name: vclogg2-linux-x86_64
          path: |
            dist/linux-x86_64/vclogg2-*-linux-x86_64.tar.gz
            dist/linux-x86_64/vclogg2-*-linux-x86_64.blockmap.json
            dist/linux-x86_64/latest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [windows, macos, linux]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Download Windows release package
        uses: actions/download-artifact@v8
        with:
          name: vclogg2-windows-x86_64
          path: release-assets/windows-x86_64

      - name: Download macOS release package
        uses: actions/download-artifact@v8
        with:
          name: vclogg2-macos-aarch64
          path: release-assets/macos-aarch64

      - name: Download Linux release package
        uses: actions/download-artifact@v8
        with:
          name: vclogg2-linux-x86_64
          path: release-assets/linux-x86_64

      - name: Prepare GitHub update manifests
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          if not tag.startswith("v"):
              raise SystemExit(f"Release tag must start with v: {tag}")
          version = tag[1:]
          release_root = Path("release-assets")
          platforms = (
              ("windows", "x86_64"),
              ("macos", "aarch64"),
              ("linux", "x86_64"),
          )

          for platform, architecture in platforms:
              source_directory = release_root / f"{platform}-{architecture}"
              source_manifest = source_directory / "latest.json"
              manifest = json.loads(source_manifest.read_text(encoding="utf-8"))
              expected = {
                  "schemaVersion": 1,
                  "product": "VCLogg2",
                  "version": version,
                  "platform": platform,
                  "architecture": architecture,
              }
              for key, expected_value in expected.items():
                  if manifest.get(key) != expected_value:
                      raise SystemExit(
                          f"{source_manifest}: {key} must be {expected_value!r}, "
                          f"got {manifest.get(key)!r}"
                      )

              archive = source_directory / manifest["artifact"]
              blockmap = source_directory / manifest["blockmap"]
              if not archive.is_file() or not blockmap.is_file():
                  raise SystemExit(f"{source_manifest}: referenced release assets are missing")
              if archive.stat().st_size != manifest["size"]:
                  raise SystemExit(f"{archive}: size does not match the update manifest")
              digest = hashlib.sha256()
              with archive.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              if digest.hexdigest().lower() != manifest["sha256"].lower():
                  raise SystemExit(f"{archive}: SHA-256 does not match the update manifest")

              target_manifest = release_root / f"latest-{platform}-{architecture}.json"
              shutil.copyfile(source_manifest, target_manifest)
          PY

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_options=(
            --verify-tag
            --generate-notes
            --title "VCLogg2 $GITHUB_REF_NAME"
            --latest
          )
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_options=(
              --verify-tag
              --generate-notes
              --title "VCLogg2 $GITHUB_REF_NAME"
              --prerelease
              --latest=false
            )
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            release-assets/windows-x86_64/vclogg2-*-windows-x86_64.zip \
            release-assets/macos-aarch64/vclogg2-*-macos-aarch64.zip \
            release-assets/linux-x86_64/vclogg2-*-linux-x86_64.tar.gz \
            release-assets/*/*.blockmap.json \
            release-assets/latest-*.json \
            "${release_options[@]}"
