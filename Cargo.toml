[workspace]
members = [
    "compat/xim-ctext",
    "crates/vclogg-ai",
    "crates/vclogg-app",
    "crates/vclogg-core",
    "crates/vclogg-data",
]
exclude = ["vendor/block"]
resolver = "2"

[workspace.package]
authors = ["zhaiyanqi"]
edition = "2024"
license = "Apache-2.0"
# Cargo requires package metadata to contain a version. Release builds use the
# v<semver> Git tag instead; keep this placeholder stable between releases.
version = "0.0.0"

[workspace.dependencies]
aho-corasick = "1.1"
anyhow = "1"
async-channel = "2"
chrono = "0.4"
dirs = "6"
gpui-kit = "=0.6.4"
log = "0.4"
notify = "7.0"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls-native-roots",
    "rustls-tls-webpki-roots",
] }
rayon = "1.11"
roaring = "0.11.4"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
tempfile = "3"
trash = "5.2.6"
url = "2"
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

# GPUI's macOS dependency chain still uses block 0.1.6. Keep its public API,
# but replace the uninhabited opaque Class type that rustc is phasing out.
[patch.crates-io]
block = { path = "vendor/block" }
# Bridge the legacy XIM dependency to the official decoder with GB2312 fixes.
xim-ctext = { path = "compat/xim-ctext" }

[profile.dev]
codegen-units = 16
debug = "limited"

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
vclogg-core = { opt-level = 3 }
taffy = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

[profile.release]
lto = true
codegen-units = 1
debug = false
strip = true
