<svg xmlns="http://www.w3.org/2000/svg" width="720" height="226" viewBox="0 0 720 226" role="img" aria-labelledby="title desc">
  <title id="title">Shortcuts depend on focus</title>
  <desc id="desc">In the query box, Enter runs the search. With a log row selected, M marks the row and N adds a text tag.</desc>
  <rect width="720" height="226" rx="14" fill="#f4f7f8"/>
  <rect x="16" y="15" width="688" height="90" rx="6" fill="#ffffff" stroke="#b9cbd0"/>
  <text x="32" y="48" text-anchor="start" xml:space="preserve" fill="#182e3b" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="650">Search input</text>
  <text x="32" y="81" text-anchor="start" xml:space="preserve" fill="#4b6270" font-family="Menlo, Consolas, monospace" font-size="18" font-weight="450">retry|timeout</text>
  <rect x="353" y="41" width="82" height="39" rx="7" fill="#bac9ce" stroke="none"/>
  <rect x="353" y="38" width="82" height="39" rx="7" fill="#ffffff" stroke="#b9cbd0"/>
  <text x="394.0" y="64" text-anchor="middle" xml:space="preserve" fill="#182e3b" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" font-weight="630">Enter</text>
  <text x="451" y="65" text-anchor="start" xml:space="preserve" fill="#126459" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" font-weight="550">Run this query</text>
  <rect x="16" y="118" width="688" height="92" rx="6" fill="#d8f0e9" stroke="none"/>
  <text x="32" y="152" text-anchor="start" xml:space="preserve" fill="#182e3b" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="650">Selected log row</text>
  <text x="32" y="183" text-anchor="start" xml:space="preserve" fill="#4b6270" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="450">4  ERROR id=42 timeout</text>
  <rect x="353" y="148" width="44" height="39" rx="7" fill="#bac9ce" stroke="none"/>
  <rect x="353" y="145" width="44" height="39" rx="7" fill="#ffffff" stroke="#b9cbd0"/>
  <text x="375.0" y="171" text-anchor="middle" xml:space="preserve" fill="#182e3b" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" font-weight="630">M</text>
  <text x="409" y="173" text-anchor="start" xml:space="preserve" fill="#126459" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="550">Mark</text>
  <rect x="493" y="148" width="44" height="39" rx="7" fill="#bac9ce" stroke="none"/>
  <rect x="493" y="145" width="44" height="39" rx="7" fill="#ffffff" stroke="#b9cbd0"/>
  <text x="515.0" y="171" text-anchor="middle" xml:space="preserve" fill="#182e3b" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" font-weight="630">N</text>
  <text x="548" y="173" text-anchor="start" xml:space="preserve" fill="#126459" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="550">Add a tag</text>
</svg>
