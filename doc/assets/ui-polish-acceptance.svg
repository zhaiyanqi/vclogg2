  </defs>

  <rect width="1440" height="920" fill="#f2f4f7"/>
  <text x="40" y="52" class="title">VCLogg2 界面优化验收板</text>
  <text x="40" y="80" class="subtitle">主题语义色 · 控件状态 · 搜索高亮 · 默认颜色标签 · 字号间距 · 160ms 动效规格</text>

  <g filter="url(#shadow)">
