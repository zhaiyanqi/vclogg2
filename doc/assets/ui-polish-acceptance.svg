<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#18212f" flood-opacity="0.12"/>
    </filter>
    <style>
      text { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
      .title { font-size: 28px; font-weight: 700; fill: #18212f; }
      .subtitle { font-size: 14px; fill: #5f6b7a; }
      .panel-title { font-size: 18px; font-weight: 700; }
      .label { font-size: 13px; font-weight: 600; }
      .meta { font-size: 12px; }
      .mono { font-family: "Cascadia Mono", "Consolas", monospace; font-size: 12px; }
