  <rect x="290" y="803" width="16" height="20" rx="2" fill="#2f6fed"/><text x="313" y="817" class="meta" fill="#5f6b7a">16</text>
  <rect x="362" y="803" width="24" height="20" rx="2" fill="#2f6fed"/><text x="393" y="817" class="meta" fill="#5f6b7a">24</text>

  <text x="510" y="816" class="label" fill="#18212f">动效</text>
  <circle cx="572" cy="812" r="6" fill="#2f6fed"/>
  <path d="M590 812 H690" stroke="#7aa7e8" stroke-width="3" stroke-linecap="round"/>
  <path d="M690 812 l-10 -7 v14 z" fill="#2f6fed"/>
  <text x="708" y="817" class="meta" fill="#5f6b7a">160ms · ease-out · 透明度 + 8px 空间位移 · 无循环 / 无弹跳</text>

  <text x="72" y="854" class="meta" fill="#5f6b7a">此图是实现规格对照板，不是真实窗口截图；真实验收步骤见 doc/ui-polish-acceptance.md。</text>
