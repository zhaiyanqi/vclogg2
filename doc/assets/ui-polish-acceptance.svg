    <rect x="592" y="670" width="244" height="58" rx="10" fill="#ff9da7"/><text x="612" y="696" class="label" fill="#18212f">08 樱粉</text><text x="612" y="716" class="meta" fill="#18212f">#FF9DA7</text>
    <rect x="852" y="670" width="244" height="58" rx="10" fill="#9c755f"/><text x="872" y="696" class="label" fill="#ffffff">09 栗棕</text><text x="872" y="716" class="meta" fill="#ffffff">#9C755F</text>
    <rect x="1112" y="670" width="244" height="58" rx="10" fill="#6f63c2"/><text x="1132" y="696" class="label" fill="#ffffff">10 靛紫</text><text x="1132" y="716" class="meta" fill="#ffffff">#6F63C2</text>
