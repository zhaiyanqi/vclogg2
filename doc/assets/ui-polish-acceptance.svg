  <text x="72" y="772" class="label" fill="#18212f">排版</text>
  <text x="132" y="772" style="font-size:18px;font-weight:700;fill:#18212f">标题 18</text>
  <text x="246" y="772" style="font-size:14px;fill:#18212f">正文/控件 14</text>
  <text x="370" y="772" style="font-size:12px;fill:#5f6b7a">辅助信息 12</text>
  <text x="510" y="772" class="meta" fill="#5f6b7a">全局 rem 基准 15px · 日志等宽字体保持独立设置</text>

